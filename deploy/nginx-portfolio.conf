server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/yujing-brand-portfolio/dist;
    index index.html;

    access_log /var/log/nginx/yujing-brand-portfolio.access.log;
    error_log /var/log/nginx/yujing-brand-portfolio.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
